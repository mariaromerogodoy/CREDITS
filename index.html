<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Link Archive</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: white;
      }
      body {
        font-family: "Times New Roman", Times, serif;
        color: #111;
      }
      main {
        width: min(1500px, 94vw);
        margin: 20px auto 70px;
        columns: 5;
        column-gap: 52px;
      }
      figure {
        margin: 0 0 16px;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      figure > a,
      .no-source {
        display: block;
        color: #0000ee;
        text-decoration: none;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 0;
        background: #f4f4f4;
      }
      figcaption {
        margin-top: 4px;
        font-size: 9px;
        line-height: 1.15;
        color: #0000ee;
        text-decoration: underline;
        overflow-wrap: anywhere;
      }
      .no-source figcaption {
        color: #666;
        text-decoration: none;
      }
      @media (max-width: 1000px) {
        main {
          columns: 2;
        }
      }
      @media (max-width: 600px) {
        main {
          width: 92vw;
          columns: 1;
          column-gap: 0;
        }
      }
    </style>
  </head>
